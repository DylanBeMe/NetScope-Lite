# Linux-only host-network mode. This lets NetScope Lite inspect the host's
# attached interfaces instead of the isolated Docker bridge network.
services:
  netscope:
    build:
      context: .
    image: netscope-lite:local
    container_name: netscope-lite
    restart: unless-stopped
    network_mode: host
    environment:
      NETSCOPE_DATA_DIR: /data
      NETSCOPE_HOST: 127.0.0.1
      NETSCOPE_PORT: 8787
      NETSCOPE_ALLOW_NON_LOOPBACK: "0"
      NETSCOPE_ALLOWED_HOSTS: ${NETSCOPE_ALLOWED_HOSTS:-}
      NETSCOPE_PASSWORD: ${NETSCOPE_PASSWORD:-}
    volumes:
      - netscope-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true

volumes:
  netscope-data:
